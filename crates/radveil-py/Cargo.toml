[package]
name = "radveil-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Python bindings for RadVeil (the `radveil` package on PyPI)"
publish = false  # shipped as Python wheels, not as a crate

[lib]
name = "_radveil"
crate-type = ["cdylib", "rlib"]

[dependencies]
radveil-core.workspace = true
ndarray.workspace = true
pyo3 = { version = "0.29", features = ["abi3-py39"] }
numpy = "0.29"

[build-dependencies]
pyo3-build-config = "0.30"

[features]
extension-module = ["pyo3/extension-module"]
