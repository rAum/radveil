[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "radveil"
description = "CPU-only NIfTI face renderer and anonymizer"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Piotr Gródek" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.txt"]
dynamic = ["version"]
dependencies = ["numpy>=1.22"]
keywords = [
    "defacing", "anonymization", "deidentification", "face-removal", "privacy",
    "mri", "ct", "nifti", "dicom", "neuroimaging", "medical-imaging",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Security",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://rAum.github.io/radveil/"
Documentation = "https://rAum.github.io/radveil/docs.html"
Demo = "https://rAum.github.io/radveil/demo/"
Repository = "https://github.com/rAum/radveil"
Issues = "https://github.com/rAum/radveil/issues"
Changelog = "https://github.com/rAum/radveil/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dlib = ["dlib>=19.24"]

[tool.maturin]
manifest-path = "crates/radveil-py/Cargo.toml"
module-name = "radveil._radveil"
python-source = "python"
features = ["extension-module"]
strip = true
include = ["python/radveil/py.typed"]
